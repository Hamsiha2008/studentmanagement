<!DOCTYPE html>
<html lang="en">
<head>

    {% load static %}
    <link rel="stylesheet" href="{% static 'students/style.css' %}">
    <title>Student Form</title>
</head>
<body>
    <h1>Student Management System</h1>

    <a href="{% url 'student_list' %}">Back to Student List</a>
</body>
</html>
